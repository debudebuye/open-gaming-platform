name: Deploy admin-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin-api/**'
      - 'packages/shared/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build admin-api
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ogp/shared build
          pnpm --filter admin-api build

      - name: Build Docker image
        run: docker build -f apps/admin-api/Dockerfile -t registry/admin-api:${{ github.sha }} .
