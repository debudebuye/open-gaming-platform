name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ogp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ogp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @ogp/shared build
          pnpm --filter @ogp/auth build
          pnpm --filter @ogp/wallet build
          pnpm --filter @ogp/betting build
          pnpm --filter @ogp/keno build
          pnpm --filter @ogp/casino build
          pnpm --filter @ogp/trading build
          pnpm --filter @ogp/payments build
          pnpm --filter @ogp/notifications build

      - name: Build apps
        run: |
          pnpm --filter identity-api build
          pnpm --filter wallet-api build
          pnpm --filter gaming-api build
          pnpm --filter trading-api build
          pnpm --filter admin-api build

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ogp_test
          DB_USER: ogp_user
          DB_PASSWORD: test_password
          DB_SCHEMA: identity
          DB_SYNC: "true"
          DB_LOGGING: "false"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-min-16-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-min-16-chars
          NODE_ENV: test
        run: pnpm --filter identity-api test
