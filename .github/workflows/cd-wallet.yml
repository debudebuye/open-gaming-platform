name: Deploy wallet-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/wallet-api/**'
      - 'packages/wallet/**'
      - 'packages/shared/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build wallet-api
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ogp/shared build
          pnpm --filter @ogp/wallet build
          pnpm --filter wallet-api build

      - name: Build Docker image
        run: docker build -f apps/wallet-api/Dockerfile -t registry/wallet-api:${{ github.sha }} .
