name: Deploy identity-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/identity-api/**'
      - 'packages/auth/**'
      - 'packages/shared/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build identity-api
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ogp/shared build
          pnpm --filter @ogp/auth build
          pnpm --filter identity-api build

      - name: Build Docker image
        run: docker build -f apps/identity-api/Dockerfile -t registry/identity-api:${{ github.sha }} .

      # TODO: Add Docker push and deploy steps when registry/K8s is configured
